<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bacchus Table QR Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f3f4f6; }
        .card { break-inside: avoid; }
        @media print {
            .no-print { display: none !important; }
            body { background: white; }
            .page { margin: 0; padding: 0; }
        }
    </style>
</head>
<body class="page">
    <div class="max-w-6xl mx-auto p-4 sm:p-6">
        <div class="no-print bg-white rounded-xl shadow p-4 sm:p-6 mb-6">
            <h1 class="text-2xl font-bold text-[#26767e]">Bacchus Table QR Generator</h1>
            <p class="text-gray-600 mt-1">Generate one QR per table. Each QR opens menu already mapped to that table.</p>

            <div class="grid sm:grid-cols-3 gap-3 mt-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Base Menu URL</label>
                    <input id="base-url" type="text" class="w-full border rounded-lg px-3 py-2" placeholder="https://bacchus-menu.vercel.app/index.html">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Start Table</label>
                    <input id="start-table" type="number" min="1" value="1" class="w-full border rounded-lg px-3 py-2">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">End Table</label>
                    <input id="end-table" type="number" min="1" value="100" class="w-full border rounded-lg px-3 py-2">
                </div>
            </div>

            <div class="flex flex-wrap gap-2 mt-4">
                <button onclick="generateQRCards()" class="px-4 py-2 bg-[#329da8] text-white rounded-lg font-semibold hover:bg-[#26767e]">Generate</button>
                <button onclick="window.print()" class="px-4 py-2 bg-gray-700 text-white rounded-lg font-semibold hover:bg-gray-800">Print</button>
            </div>
        </div>

        <div id="qr-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4"></div>
    </div>

    <script>
        function getDefaultBaseUrl() {
            const origin = window.location.origin;
            return `${origin}/index.html`;
        }

        function buildMenuLink(baseUrl, tableNumber) {
            const safeBase = baseUrl.includes('?') ? `${baseUrl}&` : `${baseUrl}?`;
            return `${safeBase}table=${encodeURIComponent(tableNumber)}`;
        }

        function generateQRCards() {
            const baseUrl = document.getElementById('base-url').value.trim();
            const start = parseInt(document.getElementById('start-table').value, 10);
            const end = parseInt(document.getElementById('end-table').value, 10);
            const grid = document.getElementById('qr-grid');

            if (!baseUrl || !start || !end || start > end) {
                alert('Please enter valid base URL and table range.');
                return;
            }

            grid.innerHTML = '';

            for (let table = start; table <= end; table++) {
                const menuLink = buildMenuLink(baseUrl, table);
                const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(menuLink)}`;

                const card = document.createElement('div');
                card.className = 'card bg-white border rounded-xl p-3 shadow-sm';
                card.innerHTML = `
                    <div class="text-center">
                        <h2 class="text-lg font-bold text-[#26767e]">Table ${table}</h2>
                        <img src="${qrUrl}" alt="QR for Table ${table}" class="w-full rounded-lg border mt-2" loading="lazy" />
                        <p class="text-[10px] text-gray-500 break-all mt-2">${menuLink}</p>
                    </div>
                `;
                grid.appendChild(card);
            }
        }

        window.onload = function() {
            document.getElementById('base-url').value = getDefaultBaseUrl();
            generateQRCards();
        };
    </script>
</body>
</html>
